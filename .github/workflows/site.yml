# The docs site in site/. Repo-only: not part of template/, which has no site.
# Runs only when the site or the pages it renders change, so other PRs pay nothing.
# Like ci, do NOT make it a required check: path filters skip it on most PRs.
name: site

on:
  pull_request:
    paths: ['site/**', 'docs/why/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/why/**', '.github/workflows/site.yml']
  # Run by hand on windows-latest to check the build on Windows (paths, line endings).
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build on
        type: choice
        options: [ubuntu-latest, windows-latest, macos-latest]
        default: ubuntu-latest

permissions:
  contents: read

# Next.js sends anonymous usage data from builds unless this is set.
env:
  NEXT_TELEMETRY_DISABLED: 1

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.os || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
