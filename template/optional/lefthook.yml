# BEST-OF-AI-DEV template v1. Optional: lefthook instead of .githooks/.
# Same checks, same scripts; lefthook only changes who calls them. Use it when the repo
# already ships lefthook (npm i -D lefthook), or wants its parallel runs and skip options.
# Copy to the repo root as lefthook.yml, then run: node scripts/setup-hooks.mjs
# setup-hooks.mjs sees lefthook.yml, clears core.hooksPath and runs "lefthook install".
# Do not keep both systems active: lefthook will not install while core.hooksPath is set.
commit-msg:
  jobs:
    - name: conventional commit
      run: node scripts/check/commit-msg.mjs {1}
pre-commit:
  jobs:
    - name: local checks
      run: node scripts/hooks/run-checks.mjs pre-commit
pre-push:
  jobs:
    - name: local checks
      run: node scripts/hooks/run-checks.mjs pre-push
